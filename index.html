<!DOCTYPE html>
<html lang="ja">

<head>

 <meta charset="UTF-8">

 <meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
 >

 <title>
  適Navi 車両検索
 </title>


 <style>

 /* =========================================================
 基本設定
 ========================================================= */

 * {
  box-sizing: border-box;
 }

 body {
  margin: 0;
  padding: 0;

  background: #f5f7f6;
  color: #333333;

  font-family:
   -apple-system,
   BlinkMacSystemFont,
   "Segoe UI",
   "Noto Sans JP",
   "Hiragino Kaku Gothic ProN",
   "Yu Gothic",
   Meiryo,
   sans-serif;
 }


 /* =========================================================
 ページ全体
 ========================================================= */

 .page {
  width: 100%;
  min-height: 100vh;

  padding: 50px 20px;
 }

 .container {
  width: 100%;
  max-width: 620px;

  margin: 0 auto;
 }


 /* =========================================================
 タイトル
 ========================================================= */

 .page-title {
  margin: 0;

  text-align: center;

  color: #222222;

  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0.04em;
 }

 .page-description {
  margin: 10px 0 30px;

  text-align: center;

  color: #666666;

  font-size: 14px;
  line-height: 1.7;
 }


 /* =========================================================
 検索カード
 ========================================================= */

 .search-card {
  position: relative;

  overflow: hidden;

  background: #ffffff;

  border: 1px solid #e2e5e3;
  border-radius: 12px;

  box-shadow:
   0 5px 18px rgba(0, 0, 0, 0.08);
 }

 .search-card::before {
  content: "";

  position: absolute;
  top: 0;
  left: 0;

  width: 100%;
  height: 5px;

  background: #00c853;
 }

 .search-card-inner {
  padding: 38px 38px 34px;
 }


 /* =========================================================
 入力項目
 ========================================================= */

 .form-group {
  margin-bottom: 25px;
 }

 .form-label {
  display: block;

  margin-bottom: 8px;

  color: #333333;

  font-size: 14px;
  font-weight: 700;
 }

 .required {
  margin-left: 6px;

  color: #00b84f;

  font-size: 12px;
 }

 .form-control {
  display: block;

  width: 100%;
  height: 48px;

  padding: 0 14px;

  background: #ffffff;

  border: 1px solid #cccccc;
  border-radius: 6px;

  color: #333333;

  font-size: 16px;

  outline: none;

  transition:
   border-color 0.2s,
   box-shadow 0.2s;
 }

 .form-control:hover {
  border-color: #999999;
 }

 .form-control:focus {
  border-color: #00c853;

  box-shadow:
   0 0 0 3px rgba(0, 200, 83, 0.12);
 }

 select.form-control {
  cursor: pointer;
 }


 /* =========================================================
 初度登録年月
 ========================================================= */

 .date-row {
  display: grid;

  grid-template-columns: 2fr 1fr;

  gap: 12px;

  width: 100%;
 }

 .date-year,
 .date-month {
  width: 100%;
  min-width: 0;
 }


 /* =========================================================
 操作ボタン
 ========================================================= */

 .search-button-wrapper {
  margin-top: 34px;
 }


 /* =========================================================
 リセットボタン
 ========================================================= */

 .reset-button {
  display: block;

  width: 100%;
  height: 46px;

  margin-bottom: 10px;

  border: 1px solid #cccccc;
  border-radius: 7px;

  background: #ffffff;

  color: #666666;

  font-size: 14px;
  font-weight: 600;

  cursor: pointer;

  transition:
   background-color 0.2s,
   border-color 0.2s,
   color 0.2s;
 }

 .reset-button:hover {
  background: #f5f5f5;

  border-color: #999999;

  color: #333333;
 }

 .reset-button:active {
  background: #eeeeee;
 }


 /* =========================================================
 検索ボタン
 ========================================================= */

 .search-button {
  display: block;

  width: 100%;
  height: 52px;

  border: none;
  border-radius: 7px;

  background: #00c853;

  color: #ffffff;

  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.03em;

  cursor: pointer;

  box-shadow:
   0 3px 7px rgba(0, 200, 83, 0.25);

  transition:
   background-color 0.2s,
   transform 0.1s,
   box-shadow 0.2s;
 }

 .search-button:hover {
  background: #00b84f;

  box-shadow:
   0 4px 9px rgba(0, 200, 83, 0.32);
 }

 .search-button:active {
  transform: translateY(1px);

  box-shadow:
   0 2px 4px rgba(0, 200, 83, 0.22);
 }


 /* =========================================================
 メッセージ
 ========================================================= */

 .message {
  display: none;

  margin-top: 22px;
  padding: 14px 16px;

  border-radius: 6px;

  font-size: 14px;
  line-height: 1.7;
 }

 .message.error {
  display: block;

  background: #fff2f2;

  border: 1px solid #f2b8b8;

  color: #c62828;
 }

 .message.success {
  display: block;

  background: #effaf3;

  border: 1px solid #b7e6c8;

  color: #16843d;
 }


 /* =========================================================
 注意書き
 ========================================================= */

 .notice {
  margin-top: 22px;

  color: #777777;

  font-size: 12px;
  line-height: 1.7;

  text-align: center;
 }


 /* =========================================================
 スマートフォン
 ========================================================= */

 @media (max-width: 600px) {

  .page {
   padding: 30px 15px;
  }

  .page-title {
   font-size: 24px;
  }

  .page-description {
   margin-bottom: 22px;
  }

  .search-card-inner {
   padding:
    32px 22px
    26px;
  }

  .date-row {
   gap: 8px;
  }

 }

 </style>

</head>


<body>

 <main class="page">

  <div class="container">


   <!-- =====================================================
   タイトル
   ====================================================== -->

   <h1 class="page-title">
    適Navi 車両検索
   </h1>

   <p class="page-description">
    車両情報を入力して適合情報を検索します
   </p>


   <!-- =====================================================
   検索フォーム
   ====================================================== -->

   <div class="search-card">

    <div class="search-card-inner">


     <!-- メーカー -->

     <div class="form-group">

      <label
       class="form-label"
       for="maker"
      >
       メーカー

       <span class="required">
        必須
       </span>

      </label>

      <select
       id="maker"
       class="form-control"
      >

       <option value="">
        メーカーを選択してください
       </option>

       <option value="1">
        トヨタ
       </option>

       <option value="2">
        日産
       </option>

       <option value="3">
        ホンダ
       </option>

       <option value="9">
        ダイハツ
       </option>

       <option value="8">
        スズキ
       </option>

       <option value="5">
        マツダ
       </option>

       <option value="6">
        三菱
       </option>

       <option value="4">
        スバル
       </option>

       <option value="10">
        レクサス
       </option>

       <option value="7">
        いすず
       </option>

       <option value="99">
        外車
       </option>

      </select>

     </div>


     <!-- 車名 -->

     <div class="form-group">

      <label
       class="form-label"
       for="carName"
      >
       車名

       <span class="required">
        必須
       </span>

      </label>

      <input
       id="carName"
       class="form-control"
       type="text"
       placeholder="例：ハリアー"
       autocomplete="off"
      >

     </div>


     <!-- 型式 -->

     <div class="form-group">

      <label
       class="form-label"
       for="model"
      >
       型式

       <span class="required">
        必須
       </span>

      </label>

      <input
       id="model"
       class="form-control"
       type="text"
       placeholder="例：6BA-MXUA80"
       autocomplete="off"
      >

     </div>


     <!-- 初度登録年月 -->

     <div class="form-group">

      <label class="form-label">

       初度登録年月

       <span class="required">
        必須
       </span>

      </label>


      <div class="date-row">


       <!-- 年 -->

       <select
        id="registrationYear"
        class="form-control date-year"
       >

        <option value="">
         年を選択してください
        </option>

       </select>


       <!-- 月 -->

       <select
        id="registrationMonth"
        class="form-control date-month"
       >

        <option value="">
         月を選択
        </option>

        <option value="1">1月</option>
        <option value="2">2月</option>
        <option value="3">3月</option>
        <option value="4">4月</option>
        <option value="5">5月</option>
        <option value="6">6月</option>
        <option value="7">7月</option>
        <option value="8">8月</option>
        <option value="9">9月</option>
        <option value="10">10月</option>
        <option value="11">11月</option>
        <option value="12">12月</option>

       </select>

      </div>

     </div>


     <!-- 操作ボタン -->

     <div class="search-button-wrapper">


      <!-- リセットボタン -->

      <button
       id="resetButton"
       class="reset-button"
       type="button"
      >
       入力内容をリセット
      </button>


      <!-- 検索ボタン -->

      <button
       id="searchButton"
       class="search-button"
       type="button"
      >
       適Naviで検索
      </button>


     </div>


     <!-- メッセージ -->

     <div
      id="message"
      class="message"
     ></div>


    </div>

   </div>


   <!-- 注意書き -->

   <p class="notice">
    AIによるマッチング検索です。<br>
    検索結果は必ず車両情報と照合してください。
   </p>


  </div>

 </main>


 <script>

 'use strict';


 // =========================================================
 // 要素取得
 // =========================================================

 const maker =
  document.getElementById(
   'maker'
  );

 const carName =
  document.getElementById(
   'carName'
  );

 const model =
  document.getElementById(
   'model'
  );

 const registrationYear =
  document.getElementById(
   'registrationYear'
  );

 const registrationMonth =
  document.getElementById(
   'registrationMonth'
  );

 const resetButton =
  document.getElementById(
   'resetButton'
  );

 const searchButton =
  document.getElementById(
   'searchButton'
  );

 const message =
  document.getElementById(
   'message'
  );


 // =========================================================
 // 初度登録年
 // 西暦 + 和暦
 // =========================================================

 function getJapaneseYear(
  year
 ) {

  // 令和
  if (year >= 2019) {

   const eraYear =
    year - 2018;

   if (eraYear === 1) {
    return '令和元年';
   }

   return (
    '令和' +
    eraYear +
    '年'
   );

  }


  // 平成
  if (year >= 1989) {

   const eraYear =
    year - 1988;

   if (eraYear === 1) {
    return '平成元年';
   }

   return (
    '平成' +
    eraYear +
    '年'
   );

  }


  // 昭和
  if (year >= 1926) {

   const eraYear =
    year - 1925;

   if (eraYear === 1) {
    return '昭和元年';
   }

   return (
    '昭和' +
    eraYear +
    '年'
   );

  }


  return '';

 }


 // =========================================================
 // 年プルダウンを作成
 // =========================================================

 function createRegistrationYearOptions() {

  const currentYear =
   new Date().getFullYear();

  for (
   let year = currentYear;
   year >= 1926;
   year -= 1
  ) {

   const option =
    document.createElement(
     'option'
    );

   // 実際に検索で使用する値
   option.value =
    String(year);


   // 画面に表示する文字
   option.textContent =
    year +
    '年（' +
    getJapaneseYear(year) +
    '）';


   registrationYear.appendChild(
    option
   );

  }

 }


 // 年プルダウンを生成
 createRegistrationYearOptions();


 // =========================================================
 // メッセージ表示
 // =========================================================

 function showMessage(
  text,
  type
 ) {

  message.innerHTML =
   text;

  message.className =
   'message ' + type;

 }


 // =========================================================
 // メーカー名取得
 // =========================================================

 function getMakerName() {

  if (
   maker.selectedIndex < 0
  ) {
   return '';
  }

  return maker.options[
   maker.selectedIndex
  ].text.trim();

 }


 // =========================================================
 // 入力内容をリセット
 // =========================================================

 resetButton.addEventListener(
  'click',
  function () {

   // メーカーを初期状態へ
   maker.value = '';

   // 車名を空欄へ
   carName.value = '';

   // 型式を空欄へ
   model.value = '';

   // 初度登録年を初期状態へ
   registrationYear.value = '';

   // 初度登録月を初期状態へ
   registrationMonth.value = '';

   // エラー・成功メッセージを消す
   message.textContent = '';
   message.className = 'message';

   // メーカーへフォーカス
   maker.focus();

  }
 );


 // =========================================================
 // 検索ボタン
 // =========================================================

 searchButton.addEventListener(
  'click',
  function () {


   // -----------------------------------------------------
   // 入力値取得
   // -----------------------------------------------------

   const makerValue =
    maker.value;

   const makerName =
    getMakerName();

   const carNameValue =
    carName.value.trim();

   const modelValue =
    model.value.trim();

   const year =
    registrationYear.value.trim();

   const month =
    registrationMonth.value.trim();


   // -----------------------------------------------------
   // 入力確認
   // -----------------------------------------------------

   if (!makerValue) {

    showMessage(
     'メーカーを選択してください。',
     'error'
    );

    maker.focus();

    return;

   }


   if (!carNameValue) {

    showMessage(
     '車名を入力してください。',
     'error'
    );

    carName.focus();

    return;

   }


   if (!modelValue) {

    showMessage(
     '型式を入力してください。',
     'error'
    );

    model.focus();

    return;

   }


   if (!year) {

    showMessage(
     '初度登録年を選択してください。',
     'error'
    );

    registrationYear.focus();

    return;

   }


   if (!month) {

    showMessage(
     '初度登録月を選択してください。',
     'error'
    );

    registrationMonth.focus();

    return;

   }


   // -----------------------------------------------------
   // 外車は検索対象外
   // -----------------------------------------------------

   if (
    Number(makerValue) === 99
   ) {

    showMessage(
     '外車は適Naviの検索対象外です。',
     'error'
    );

    maker.focus();

    return;

   }


   // -----------------------------------------------------
   // 適Naviへ渡す車両データ
   // 既存ブックマークレットと同じ項目名にする
   // -----------------------------------------------------

   const vehicle = {

    source:
     'github-vehicle-search',

    type:
     'TEKIGNAVI_SEARCH',

    makerName:
     makerName,

    makerId:
     Number(makerValue),

    carKeyword:
     carNameValue,

    model:
     modelValue,

    date:
     Number(year) +
     '/' +
     Number(month) +
     '/1',

    sentAt:
     new Date().toISOString()

   };


   console.log(
    '適Naviへ渡す車両情報:',
    vehicle
   );


   // -----------------------------------------------------
   // 車両情報をURLのハッシュへ格納
   // -----------------------------------------------------

   const encodedVehicle =
    encodeURIComponent(
     JSON.stringify(
      vehicle
     )
    );


   const tekignaviUrl =
    'https://eneos.cla-ss.com/searches/maker/' +
    '#kintoneVehicle=' +
    encodedVehicle;


   // -----------------------------------------------------
   // 適Naviを開く
   // 同じ名前のタブを再利用する
   // -----------------------------------------------------

   const tekignaviWindow =
    window.open(
     tekignaviUrl,
     'ENEOS_TEKIGNAVI'
    );


   if (!tekignaviWindow) {

    showMessage(
     '適Naviを開けませんでした。ポップアップブロックを解除してください。',
     'error'
    );

    return;

   }


   // -----------------------------------------------------
   // GitHub側の案内
   // -----------------------------------------------------

   showMessage(
    '車両情報を適Naviへ送りました。<br>' +
    '適Naviの画面でブックマークレットを実行してください。',
    'success'
   );

  }
 );

 </script>

</body>

</html>
