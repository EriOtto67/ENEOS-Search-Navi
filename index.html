<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>適Navi 車両検索</title>

  <style>
    /* =========================================================
       基本設定
    ========================================================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f5f7f6;
      color: #333333;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
    }


    /* =========================================================
       ページ全体
    ========================================================= */

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 50px 20px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }


    /* =========================================================
       タイトル
    ========================================================= */

    .page-title {
      margin: 0;
      text-align: center;
      color: #222222;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .page-description {
      margin: 10px 0 30px;
      text-align: center;
      color: #666666;
      font-size: 14px;
      line-height: 1.7;
    }


    /* =========================================================
       検索カード
    ========================================================= */

    .search-card {
      position: relative;
      overflow: hidden;

      background: #ffffff;

      border: 1px solid #e2e5e3;
      border-radius: 12px;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.08);
    }

    .search-card::before {
      content: "";

      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 5px;

      background: #00c853;
    }

    .search-card-inner {
      padding: 38px 38px 34px;
    }


    /* =========================================================
       入力項目
    ========================================================= */

    .form-group {
      margin-bottom: 25px;
    }

    .form-label {
      display: block;

      margin-bottom: 8px;

      color: #333333;

      font-size: 14px;
      font-weight: 700;
    }

    .required {
      margin-left: 6px;
      color: #00b84f;
      font-size: 12px;
    }

    .form-control {
      display: block;

      width: 100%;
      height: 48px;

      padding: 0 14px;

      background: #ffffff;

      border: 1px solid #cccccc;
      border-radius: 6px;

      color: #333333;

      font-size: 16px;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    .form-control:hover {
      border-color: #999999;
    }

    .form-control:focus {
      border-color: #00c853;

      box-shadow:
        0 0 0 3px rgba(0, 200, 83, 0.12);
    }

    select.form-control {
      cursor: pointer;
    }


/* =========================================================
   初度登録年月
========================================================= */

.date-row {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 12px;
  width: 100%;
}

.date-year,
.date-month {
  width: 100%;
  min-width: 0;
}


    /* =========================================================
       検索ボタン
    ========================================================= */

    .search-button-wrapper {
  margin-top: 34px;
}


/* =========================================================
   リセットボタン
========================================================= */

.reset-button {
  display: block;

  width: 100%;
  height: 46px;

  margin-bottom: 10px;

  border: 1px solid #cccccc;
  border-radius: 7px;

  background: #ffffff;

  color: #666666;

  font-size: 14px;
  font-weight: 600;

  cursor: pointer;

  transition:
    background-color 0.2s,
    border-color 0.2s,
    color 0.2s;
}

.reset-button:hover {
  background: #f5f5f5;
  border-color: #999999;
  color: #333333;
}

.reset-button:active {
  background: #eeeeee;
}

    .search-button {
      display: block;

      width: 100%;
      height: 52px;

      border: none;
      border-radius: 7px;

      background: #00c853;

      color: #ffffff;

      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.03em;

      cursor: pointer;

      box-shadow:
        0 3px 7px rgba(0, 200, 83, 0.25);

      transition:
        background-color 0.2s,
        transform 0.1s,
        box-shadow 0.2s;
    }

    .search-button:hover {
      background: #00b84f;

      box-shadow:
        0 4px 9px rgba(0, 200, 83, 0.32);
    }

    .search-button:active {
      transform: translateY(1px);
      box-shadow:
        0 2px 4px rgba(0, 200, 83, 0.22);
    }


    /* =========================================================
       メッセージ
    ========================================================= */

    .message {
      display: none;

      margin-top: 22px;
      padding: 14px 16px;

      border-radius: 6px;

      font-size: 14px;
      line-height: 1.7;
    }

    .message.error {
      display: block;

      background: #fff2f2;

      border: 1px solid #f2b8b8;

      color: #c62828;
    }

    .message.success {
      display: block;

      background: #effaf3;

      border: 1px solid #b7e6c8;

      color: #16843d;
    }


    /* =========================================================
       注意書き
    ========================================================= */

    .notice {
      margin-top: 22px;

      color: #777777;

      font-size: 12px;
      line-height: 1.7;

      text-align: center;
    }


    /* =========================================================
       スマートフォン
    ========================================================= */

    @media (max-width: 600px) {

      .page {
        padding: 30px 15px;
      }

      .page-title {
        font-size: 24px;
      }

      .page-description {
        margin-bottom: 22px;
      }

      .search-card-inner {
        padding:
          32px 22px
          26px;
      }

      .date-row {
        gap: 8px;
      }

    }

    /* =========================================================
 コーションプレート読取
========================================================= */

.ocr-section {
 margin-bottom: 30px;
 padding: 18px;

 background: #f7fbf8;

 border: 1px solid #cfe7d7;
 border-radius: 8px;
}

.ocr-title {
 margin: 0 0 6px;

 color: #333333;

 font-size: 16px;
 font-weight: 700;
}

.ocr-description {
 margin: 0 0 14px;

 color: #666666;

 font-size: 12px;
 line-height: 1.6;
}

.ocr-file-input {
 display: none;
}

.ocr-select-button,
.ocr-read-button {
 display: block;

 width: 100%;
 height: 46px;

 border-radius: 7px;

 font-size: 14px;
 font-weight: 700;

 cursor: pointer;
}

.ocr-select-button {
 padding: 12px;

 background: #ffffff;

 border: 1px solid #00c853;

 color: #00a944;

 text-align: center;
}

.ocr-select-button:hover {
 background: #f0fff6;
}

.ocr-read-button {
 margin-top: 10px;

 background: #00c853;

 border: none;

 color: #ffffff;
}

.ocr-read-button:hover {
 background: #00b84f;
}

.ocr-read-button:disabled {
 background: #bbbbbb;
 cursor: not-allowed;
}

.ocr-preview {
 display: none;

 width: 100%;
 max-height: 280px;

 margin-top: 14px;

 border: 1px solid #dddddd;
 border-radius: 6px;

 object-fit: contain;
}

.ocr-status {
 display: none;

 margin-top: 12px;
 padding: 10px 12px;

 background: #fff8e1;

 border: 1px solid #ffe082;
 border-radius: 6px;

 color: #6d5700;

 font-size: 13px;
 line-height: 1.6;
}

.ocr-progress {
 display: none;

 width: 100%;
 height: 18px;

 margin-top: 10px;
}

  </style>
</head>


<body>

  <main class="page">

    <div class="container">

      <!-- =====================================================
           タイトル
      ====================================================== -->

      <h1 class="page-title">
        適Navi 車両検索
      </h1>

      <p class="page-description">
        車両情報を入力して適合情報を検索します
      </p>


      <!-- =====================================================
           検索フォーム
      ====================================================== -->

      <div class="search-card">

        <div class="search-card-inner">

          <!-- コーションプレート読取 -->

<div class="ocr-section">

 <p class="ocr-title">
 コーションプレート読取
 </p>

 <p class="ocr-description">
 コーションプレートを撮影すると、メーカーと型式を自動入力します。
 読み取り後は、必ず内容を確認してください。
 </p>

 <label
 class="ocr-select-button"
 for="ocrImageInput"
 >
 写真を撮影・選択
 </label>

 <input
 id="ocrImageInput"
 class="ocr-file-input"
 type="file"
 accept="image/*"
 capture="environment"
 >

 <img
 id="ocrPreview"
 class="ocr-preview"
 alt="コーションプレート写真"
 >

 <button
 id="ocrReadButton"
 class="ocr-read-button"
 type="button"
 disabled
 >
 写真から読み取る
 </button>

 <progress
 id="ocrProgress"
 class="ocr-progress"
 value="0"
 max="100"
 ></progress>

 <div
 id="ocrStatus"
 class="ocr-status"
 ></div>

</div>

<!-- メーカー -->

          <div class="form-group">

            <label
              class="form-label"
              for="maker"
            >
              メーカー
              <span class="required">
                必須
              </span>
            </label>

            <select
  id="maker"
  class="form-control"
>
  <option value="">
  メーカーを選択してください
</option>

<option value="1">
  トヨタ
</option>

<option value="8">

</option>

<option value="5">

<option value="6">

</option>

</option>

<option value="10">
  レクサス
</option>

<option value="7">
  いすず
</option>

</option>

          </div>


          <!-- 車名 -->

          <div class="form-group">

            <label

              車名
              <span class="required">

          <!-- 初度登録年月 -->

<div class="form-group">

  <label class="form-label">

    初度登録年月

    <span class="required">
      必須
    </span>

  </label>


  <div class="date-row">


    <!-- 年 -->

    <select
      id="registrationYear"
      class="form-control date-year"
    >

      <option value="">
        年を選択してください
      </option>

    </select>


    <!-- 月 -->

    <select
      id="registrationMonth"
      class="form-control date-month"
    >

      <option value="">
        月を選択
      </option>

      <option value="1">1月</option>
      <option value="2">2月</option>
      <option value="3">3月</option>
      <option value="4">4月</option>
      <option value="5">5月</option>
      <option value="6">6月</option>
      <option value="7">7月</option>
      <option value="8">8月</option>
      <option value="9">9月</option>
      <option value="10">10月</option>
      <option value="11">11月</option>

    </select>


  </div>

</div>


          <!-- 操作ボタン -->

<div class="search-button-wrapper">


  <!-- リセットボタン -->

  <button
    id="resetButton"
    class="reset-button"
    type="button"
  >
    入力内容をリセット
  </button>


  <!-- 検索ボタン -->

  <button
    id="searchButton"
    class="search-button"

  >
    適Naviで検索
  </button>


</div>


          <!-- メッセージ -->

          <div
            id="message"
            class="message"
          ></div>


        </div>

      </div>


      <!-- 注意書き -->

      <p class="notice">
        AIによるマッチング検索です。<br>
        検索結果は必ず車両情報と照合してください。
      </p>


    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
    
  </script>

  <script>

    'use strict';


    // =========================================================
    // 要素取得
    // =========================================================

    const maker =
      document.getElementById('maker');

    const carName =
      document.getElementById('carName');

    const model =
      document.getElementById('model');

    const registrationYear =
      document.getElementById('registrationYear');

    const registrationMonth =
  document.getElementById('registrationMonth');

const resetButton =
  document.getElementById('resetButton');

const searchButton =
  document.getElementById('searchButton');

    const ocrImageInput =
 document.getElementById('ocrImageInput');

const ocrPreview =
 document.getElementById('ocrPreview');

const ocrReadButton =
 document.getElementById('ocrReadButton');

const ocrProgress =
 document.getElementById('ocrProgress');

const ocrStatus =
 document.getElementById('ocrStatus');

let selectedOcrImage = null;
let ocrPreviewUrl = '';

    // =========================================================
// 初度登録年
// 西暦 + 和暦
// =========================================================

function getJapaneseYear(year) {

  // 令和
  if (year >= 2019) {

    const eraYear =
      year - 2018;

    if (eraYear === 1) {
      return '令和元年';
    }

    return '令和' + eraYear + '年';

  }


  // 平成
  if (year >= 1989) {

    const eraYear =
      year - 1988;

    if (eraYear === 1) {
      return '平成元年';
    }

    return '平成' + eraYear + '年';

  }


  // 昭和
  if (year >= 1926) {

    const eraYear =
      year - 1925;

    if (eraYear === 1) {
      return '昭和元年';
    }

    return '昭和' + eraYear + '年';

  }


  return '';

}


// =========================================================
// 年プルダウンを作成
// =========================================================

function createRegistrationYearOptions() {

  const currentYear =
    new Date().getFullYear();

  for (
    let year = currentYear;
    year >= 1926;
    year -= 1
  ) {

    const option =
      document.createElement('option');

    // 実際に検索で使用する値
    option.value =
      String(year);


    // 画面に表示する文字
    option.textContent =
      year +
      '年（' +
      getJapaneseYear(year) +
      '）';


    registrationYear.appendChild(
      option
    );

  }

}


// 年プルダウンを生成
createRegistrationYearOptions();

    const message =
      document.getElementById('message');


    // =========================================================
    // メッセージ表示
    // =========================================================

    function showMessage(
 text,
 type
 ) {

 message.innerHTML = text;

 message.className =
 'message ' + type;

}


    // =========================================================
    // メーカー名取得
    // =========================================================

    function getMakerName() {

      if (
        maker.selectedIndex < 0
      ) {
        return '';
      }

      return maker.options[
        maker.selectedIndex
      ].text.trim();

    }

    // =========================================================
// 入力内容をリセット
// =========================================================

resetButton.addEventListener(
  'click',
  function () {

    // メーカーを初期状態へ
    maker.value = '';

    // 車名を空欄へ
    carName.value = '';

    // 型式を空欄へ
    model.value = '';

    // 初度登録年を初期状態へ
    registrationYear.value = '';

    // 初度登録月を初期状態へ
    registrationMonth.value = '';

    // OCR画像選択をリセット
ocrImageInput.value = '';

selectedOcrImage = null;

if (ocrPreviewUrl) {

 URL.revokeObjectURL(
 ocrPreviewUrl
 );

 ocrPreviewUrl = '';

}

ocrPreview.removeAttribute(
 'src'
);

ocrPreview.style.display =
 'none';

ocrProgress.value =
 0;

ocrProgress.style.display =
 'none';

ocrStatus.textContent =
 '';

ocrStatus.style.display =
 'none';

ocrReadButton.disabled =
 true;

    // エラー・成功メッセージを消す
    message.textContent = '';
    message.className = 'message';

    // メーカーへフォーカス
    maker.focus();

  }
);

    // =========================================================
// 写真を選択したとき
// =========================================================

ocrImageInput.addEventListener(
 'change',
 function () {

 const file =
 ocrImageInput.files[0];

 if (!file) {
 return;
 }

 selectedOcrImage =
 file;

 if (ocrPreviewUrl) {

 URL.revokeObjectURL(
 ocrPreviewUrl
 );

 }

 ocrPreviewUrl =
 URL.createObjectURL(file);

 ocrPreview.src =
 ocrPreviewUrl;

 ocrPreview.style.display =
 'block';

 ocrReadButton.disabled =
 false;

 ocrProgress.value =
 0;

 ocrProgress.style.display =
 'none';

 ocrStatus.textContent =
 '写真を選択しました。「写真から読み取る」を押してください。';

 ocrStatus.style.display =
 'block';

 }
);


// =========================================================
// 写真から文字を読み取る
// =========================================================

ocrReadButton.addEventListener(
 'click',
 async function () {

 if (!selectedOcrImage) {

 ocrStatus.textContent =
 '先に写真を選択してください。';

 ocrStatus.style.display =
 'block';

 return;

 }

 if (typeof Tesseract === 'undefined') {

 ocrStatus.textContent =
 'OCR機能を読み込めませんでした。インターネット接続を確認してください。';

 ocrStatus.style.display =
 'block';

 return;

 }

 ocrReadButton.disabled =
 true;

 ocrProgress.value =
 0;

 ocrProgress.style.display =
 'block';

 ocrStatus.textContent =
 'OCRを準備しています。';

 ocrStatus.style.display =
 'block';

 try {

 const result =
 await Tesseract.recognize(
 selectedOcrImage,
 'jpn+eng',
 {
 logger:
 function (ocrMessage) {

 console.log(
 'OCR進行状況:',
 ocrMessage
 );

 if (
 typeof ocrMessage.progress ===
 'number'
 ) {

 const percent =
 Math.round(
 ocrMessage.progress * 100
 );

 ocrProgress.value =
 percent;

 if (
 ocrMessage.status ===
 'recognizing text'
 ) {

 ocrStatus.textContent =
 '写真の文字を読み取っています。' +
 percent +
 '％';

 }

 }

 }
 }
 );

 const rawText =
 result.data.text || '';

 console.log(
 'OCR読取全文:',
 rawText
 );

 const vehicleInfo =
 extractVehicleInfoFromOcr(
 rawText
 );

 if (vehicleInfo.makerId) {

 maker.value =
 vehicleInfo.makerId;

 }

 if (vehicleInfo.model) {

 model.value =
 vehicleInfo.model;

 }

 if (
 vehicleInfo.makerId ||
 vehicleInfo.model
 ) {

 const makerResult =
 vehicleInfo.makerId
 ? getMakerName()
 : '取得できませんでした';

 const modelResult =
 vehicleInfo.model ||
 '取得できませんでした';

 ocrStatus.textContent =
 '読み取りが完了しました。\n' +
 'メーカー：' +
 makerResult +
 '\n' +
 '型式：' +
 modelResult +
 '\n' +
 '内容を確認してください。';

 } else {

 ocrStatus.textContent =
 '文字は読み取りましたが、メーカーと型式を抽出できませんでした。';

 }

 ocrProgress.value =
 100;

 } catch (error) {

 console.error(
 'OCRエラー:',
 error
 );

 ocrStatus.textContent =
 '読み取りに失敗しました。コンソールを確認してください。';

 } finally {

 ocrReadButton.disabled =
 false;

 }

 }
);


// =========================================================
// OCR結果からメーカーと型式を取得
// =========================================================

function extractVehicleInfoFromOcr(
 rawText
) {

 const text =
 normalizeOcrText(
 rawText
 );

 const vehicleInfo = {

 makerId:
 '',

 model:
 ''

 };


// ---------------------------------------------------------
// メーカー判定
// ---------------------------------------------------------

 if (
 text.includes('本田') ||
 text.includes('HONDA')
 ) {

 vehicleInfo.makerId =
 '3';

 } else if (
 text.includes('トヨタ') ||
 text.includes('TOYOTA')
 ) {

 vehicleInfo.makerId =
 '1';

 } else if (
 text.includes('日産') ||
 text.includes('NISSAN')
 ) {

 vehicleInfo.makerId =
 '2';

 } else if (
 text.includes('ダイハツ') ||
 text.includes('DAIHATSU')
 ) {

 vehicleInfo.makerId =
 '9';

 } else if (
 text.includes('スズキ') ||
 text.includes('SUZUKI')
 ) {

 vehicleInfo.makerId =
 '8';

 } else if (
 text.includes('マツダ') ||
 text.includes('MAZDA')
 ) {

 vehicleInfo.makerId =
 '5';

 } else if (
 text.includes('三菱') ||
 text.includes('MITSUBISHI')
 ) {

 vehicleInfo.makerId =
 '6';

 } else if (
 text.includes('スバル') ||
 text.includes('SUBARU')
 ) {

 vehicleInfo.makerId =
 '4';

 } else if (
 text.includes('レクサス') ||
 text.includes('LEXUS')
 ) {

 vehicleInfo.makerId =
 '10';

 } else if (
 text.includes('いすゞ') ||
 text.includes('いすず') ||
 text.includes('ISUZU')
 ) {

 vehicleInfo.makerId =
 '7';

 }


// ---------------------------------------------------------
// 型式取得
// 例：5BA-GB5、6AA-ZVG11、DAA-GP5
// ---------------------------------------------------------

 const modelMatch =
 text.match(
 /\b(?:[345678]BA|[345678]AA|DAA|DBA|CBA|ABA|CAA|DLA|LA|TA|UA)-[A-Z0-9]{2,10}\b/
 );

 if (modelMatch) {

 vehicleInfo.model =
 modelMatch[0];

 }

 console.log(
 'OCR正規化後:',
 text
 );

 console.log(
 'OCR抽出結果:',
 vehicleInfo
 );

 return vehicleInfo;

}


// =========================================================
// OCR結果を整える
// =========================================================

function normalizeOcrText(
 rawText
) {

 return rawText

 .toUpperCase()

 .replace(
 /[Ａ-Ｚａ-ｚ０-９]/g,
 function (character) {

 return String.fromCharCode(
 character.charCodeAt(0) -
 0xFEE0
 );

 }
 )

 .replace(
 /[―ー‐‑–—−]/g,
 '-'
 )

 .replace(
 /\s*-\s*/g,
 '-'
 )

 .replace(
 /\s+/g,
 ' '
 )

 .trim();

}

    // =========================================================
    // 検索ボタン
    // =========================================================

    searchButton.addEventListener(
      'click',
      function () {


        // -----------------------------------------------------
        // 入力値取得
        // -----------------------------------------------------

        const makerValue =
          maker.value;

        const makerName =
          getMakerName();

        const carNameValue =
          carName.value.trim();

        const modelValue =
          model.value.trim();

        const year =
          registrationYear.value.trim();

        const month =
          registrationMonth.value.trim();


        // -----------------------------------------------------
        // 入力確認
        // -----------------------------------------------------

        if (!makerValue) {

          showMessage(
            'メーカーを選択してください。',
            'error'
          );

          maker.focus();

          return;

        }


        if (!carNameValue) {

          showMessage(
            '車名を入力してください。',
            'error'
          );

          carName.focus();

          return;

        }


        if (!modelValue) {

          showMessage(
            '型式を入力してください。',
            'error'
          );

          model.focus();

          return;

        }


        if (!year) {

  showMessage(
    '初度登録年を選択してください。',
    'error'
  );

  registrationYear.focus();

  return;

}


        if (!month) {

  showMessage(
    '初度登録月を選択してください。',
    'error'
  );

  registrationMonth.focus();

  return;

}


// -----------------------------------------------------
// 外車は検索対象外
// -----------------------------------------------------

if (Number(makerValue) === 99) {

  showMessage(
    '外車は適Naviの検索対象外です。',
    'error'
  );

  maker.focus();

  return;

}


// -----------------------------------------------------
// 適Naviへ渡す車両データ
// 既存ブックマークレットと同じ項目名にする
// -----------------------------------------------------

const vehicle = {

  source:
    'github-vehicle-search',

  type:
    'TEKIGNAVI_SEARCH',

  makerName:
    makerName,

  makerId:
    Number(makerValue),

  carKeyword:
    carNameValue,

  model:
    modelValue,

  date:
    Number(year) +
    '/' +
    Number(month) +
    '/1',

  sentAt:
    new Date().toISOString()

};


console.log(
  '適Naviへ渡す車両情報:',
  vehicle
);


// -----------------------------------------------------
// 車両情報をURLのハッシュへ格納
// -----------------------------------------------------

const encodedVehicle =
  encodeURIComponent(
    JSON.stringify(vehicle)
  );


const tekignaviUrl =
  'https://eneos.cla-ss.com/searches/maker/' +
  '#kintoneVehicle=' +
  encodedVehicle;


// -----------------------------------------------------
// 適Naviを開く
// 同じ名前のタブを再利用する
// -----------------------------------------------------

const tekignaviWindow =
  window.open(
    tekignaviUrl,
    'ENEOS_TEKIGNAVI'
  );


if (!tekignaviWindow) {

  showMessage(
    '適Naviを開けませんでした。ポップアップブロックを解除してください。',
    'error'
  );

  return;

}


// -----------------------------------------------------
// GitHub側の案内
// -----------------------------------------------------

showMessage(
  '車両情報を適Naviへ送りました。<br>' +
  '適Naviの画面でブックマークレットを実行してください。',
  'success'
);
      }
    );


  </script>

</body>
</html>
